# The brain's sound card: TLV320AIC3104 on the Robot HAT E1, I2S0, card "aic3104".
#
# The hardware runs 48 kHz stereo with 32-bit I2S slots (S32_LE). Speaker and
# mic share the codec's one I2S clock: when a plain playback closes, the clock
# stops and an open capture reads zeros. So every program plays through dmix
# ("duck_out") and records through dsnoop ("duck_in") on one shared 48 kHz
# stream; the plug layers convert any rate, format and channel count.
#
#   speaker: both channels reach it (the amp's J1 output is on the right channel;
#            the mixer sends a mono stream to both)
#   mic:     the onboard MEMS mic, routed to both channels by brain-audio-init
pcm.duck_dmix {
    type dmix
    ipc_key 52048
    ipc_perm 0666
    slave {
        pcm "hw:CARD=aic3104,DEV=0"
        rate 48000
        channels 2
        format S32_LE
        period_size 1024
        buffer_size 8192
    }
}
pcm.duck_dsnoop {
    type dsnoop
    ipc_key 52049
    ipc_perm 0666
    slave {
        pcm "hw:CARD=aic3104,DEV=0"
        rate 48000
        channels 2
        format S32_LE
        period_size 1024
        buffer_size 8192
    }
}
pcm.duck_out {
    type plug
    slave.pcm "duck_dmix"
}
pcm.duck_in {
    type plug
    slave.pcm "duck_dsnoop"
}
pcm.!default {
    type asym
    playback.pcm "duck_out"
    capture.pcm "duck_in"
}
ctl.!default {
    type hw
    card aic3104
}
